<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="cadastro.css">
</head>
<body>

  <form id="formulario" novalidate>
    <h1>Cadastro</h1>

    <label for="nome">Nome</label>
    <input type="text" id="nome" placeholder="Digite seu nome">
    <p class="erro" id="erro-nome"></p>

    <label for="email">E-mail</label>
    <input type="email" id="email" placeholder="Digite seu e-mail">
    <p class="erro" id="erro-email"></p>

    <label for="projeto">Nome do projeto</label>
    <input type="text" id="projeto" placeholder="Digite o nome do projeto">
    <p class="erro" id="erro-projeto"></p>

    <button type="submit">Cadastrar</button>

    <p id="mensagem-final"></p>
  </form>

  <script src="cadastro.js"></script>
</body>
</html>
